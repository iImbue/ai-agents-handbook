[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlite"
version = "0.1.0"
description = "A tiny personal expense ledger. Teaching repo for the AI Coding Agents Masterclass."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[project.scripts]
ledgerlite = "ledgerlite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
